services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wazuh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wazuh123}
      POSTGRES_DB: wazuh_monitor
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wazuh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://wazuh:${POSTGRES_PASSWORD:-wazuh123}@postgres:5432/wazuh_monitor?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY}
      FCM_CREDENTIALS_PATH: /app/firebase-service-account.json
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: Asia/Jakarta
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@siemkampus.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ROOT_URL: "'https://siemkampus-monitoring-app.duckdns.org/pgadmin/'"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_LOGIN_BANNER: "''"
      PGADMIN_CONFIG_CHECK_DATABASE_FILES: "False"
      PGADMIN_CONFIG_WEBSERVER_CONFIGURATION: "'Production'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_TIMEZONE: "'Asia/Jakarta'"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/letsencrypt:ro
      - ../wazuh_app/build/web:/var/www/wazuh-app:ro
    depends_on:
      - backend
      - pgadmin

volumes:
  postgres_data:
    external: true
    name: backend_postgres_data
  pgadmin_data:
    external: true
    name: backend_pgadmin_data
