server {
    listen 80;
    server_name siemkampus-monitoring-app.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name siemkampus-monitoring-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/siemkampus-monitoring-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siemkampus-monitoring-app.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # pgAdmin - Database GUI
    # Konfigurasi mengikuti panduan RESMI pgAdmin "HTTPS via Nginx" (subpath):
    #   X-Script-Name + X-Scheme + Host + proxy_redirect off.
    # CATATAN: JANGAN pakai proxy_cookie_path — tidak ada di panduan resmi;
    #   rewrite Path cookie bisa memicu login loop (session cookie tidak
    #   tersimpan benar). pgAdmin menangani subpath via X-Script-Name/ROOT_URL.
    location /pgadmin/ {
        auth_basic "Restricted Database GUI";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    # Flutter web build - serve static files
    location / {
        root /var/www/wazuh-app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/wazuh-api.access.log;
    error_log /var/log/nginx/wazuh-api.error.log;
}
